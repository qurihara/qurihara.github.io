<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>slate レイアウト設計</title>
<!--
  slate のレイアウトを、ボタンを直接動かして設計する GUI（2026-10-09・評価実験の GUI 条件のための道具）。
  版は下の VERSION（画面の左上に出る・書き出す JSON にも入る）。変更のたびに上げる。
    v0.1 2026-10-09 初版（移動・種類・向き・弧・THUMB と PALM・書き出し・Pyodide で本番と同じ検査）
    v0.2 2026-10-10 Pico の移動と奥行き・制御ボタンの移動と大きさと増減と機能・追加ボタン
    v0.3 2026-10-10 移動中の半透明の写し
    v0.4 2026-10-10 動かせる範囲の走査・元に戻す／やり直す・中核の高速化
    v0.5 2026-10-10 自動制約解消（α版）・置いた時点で走査を捨てる
    v0.6 2026-10-10 元に戻す／やり直すを上の帯に・版の表示・スナップ（周りのボタンの上端・下端・中心・左端・右端に吸着。Option/Alt で無効）
  1 枚の HTML で動く。配線・交差・抵抗の安全率の計算は、ブラウザの中の Python（Pyodide）で slate_core.py を実行して行う。
  slate_core.py は design_stl_v2.py の計算を写したもので、同じ入力に同じ結果を返すことを gui/verify_core.py で確かめてある。
  このページと同じ場所に slate_core.py と slit_patterns.py を置く。Pyodide と numpy・shapely は CDN から読み込む（初回 10〜20 秒）。
  「書き出す」で出る JSON を design_stl_v2.py --layout に渡すと、同じ設計の STL・3mf・ファームウェアが作られる。
-->
<style>
:root{--bg:#f4f3ee;--panel:#ffffff;--fg:#222;--muted:#6b6a63;--line:#d9d6cc;--board:#efece2;--pad:#c8731a;--pad2:#3b6d11;--sig:#185FA5;--ctrl:#8a887f;--ok:#2a7d3a;--warn:#b7791f;--err:#b42318;--sel:#e04a00}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.55}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600}
header .timer{font-variant-numeric:tabular-nums;color:var(--muted)}
header .spacer{flex:1}
header .ver{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
header .hbtn{padding:3px 10px;font-size:13px}header .hbtn:disabled{opacity:.4;cursor:default}
header .status{font-size:13px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;height:calc(100% - 49px)}
#stage{position:relative;min-width:0;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
section{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
section h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.verdict{font-weight:700;padding:6px 10px;border-radius:4px}
.verdict.ok{background:#e4f3e7;color:var(--ok)}.verdict.err{background:#fde9e7;color:var(--err)}.verdict.wait{background:#eee;color:var(--muted)}
ul.msgs{margin:6px 0 0;padding-left:18px}ul.msgs li.err{color:var(--err)}ul.msgs li.warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
label{color:var(--muted);font-size:13px}
select,input[type=number],button,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;padding:4px 8px;background:#fff;color:var(--fg)}
input[type=number]{width:80px}
button{cursor:pointer}button:hover{background:#f3f1ea}button.primary{background:var(--sig);color:#fff;border-color:var(--sig)}button.primary:hover{background:#134b84}
button.danger{color:var(--err)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12px}
td,th{padding:2px 4px;text-align:right;border-bottom:1px solid #eee}th{color:var(--muted);font-weight:500}td:first-child,th:first-child{text-align:left}
tr.worst td{color:var(--err);font-weight:600}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.hint{color:var(--muted);font-size:12px}
.dim{opacity:.5}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:60vh auto}aside{border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>slate レイアウト設計 <span class="ver" id="ver"></span></h1>
  <button class="hbtn" id="undo" title="元に戻す（Cmd/Ctrl+Z）">↶ 元に戻す</button>
  <button class="hbtn" id="redo" title="やり直す（Shift+Cmd/Ctrl+Z）">↷ やり直す</button>
  <span class="timer" id="timer">00:00</span>
  <span class="spacer"></span>
  <span class="status" id="pystatus">計算機（Python）を読み込んでいます…</span>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <section>
      <h2>判定</h2>
      <div class="verdict wait" id="verdict">計算を待っています</div>
      <ul class="msgs" id="msgs"></ul>
      <div class="hint" id="boardinfo"></div>
      <div class="row" id="resolveRow" hidden><button id="resolve">周りのボタンを動かして設計できる形にする（α版）</button><button id="resolveStop" hidden>止める</button></div>
      <div class="hint" id="resolveInfo"></div>
    </section>
    <section>
      <h2>選んだボタン</h2>
      <div id="props"><span class="hint">板の上のボタンを押すと選べます。指やマウスで動かせます。矢印キーで 1mm ずつ動きます。</span></div>
    </section>
    <section>
      <h2>ボタンの追加と削除</h2>
      <div class="row">
        <button id="addThumb">THUMB（親指の壁型）を足す</button>
        <button id="addPalm">PALM（手のひらの DNA）を足す</button>
      </div>
      <div class="row">
        <button id="addExtra">攻撃や自由な機能のボタンを足す（14 個まで）</button>
        <button id="addCtrl">制御ボタンを足す（4 個まで）</button>
      </div>
      <div class="row">
        <label>全体のスリットの弧</label><input type="number" id="arcAll" min="180" max="305" step="5" value="240"><label>°</label>

        <button id="reset">標準モデルに戻す</button>
      </div>
    </section>
    <section>
      <h2>抵抗の安全率（1.5 以上が必要）</h2>
      <table id="sftable"><thead><tr><th>ボタン</th><th>GP</th><th>信号 mm</th><th>GND mm</th><th>往復 kΩ</th><th>SF</th></tr></thead><tbody></tbody></table>
    </section>
    <section>
      <h2>書き出しと読み込み</h2>
      <div class="row"><button class="primary" id="export">書き出す（JSON をコピー）</button><button id="import">貼り付けた JSON を読み込む</button></div>
      <textarea id="json" placeholder="「書き出す」を押すと、ここに設計の JSON が出ます。これを Discord のスレッドに貼ってください。"></textarea>
      <div class="hint">JSON には操作の記録（移動・種類の変更・取り消し・書き出しの時刻）も含まれます。</div>
    </section>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// ===================== 状態 =====================
const VERSION="v0.6";
const LABEL={L:"L",D:"D",R:"R",Up:"UP",c1t:"LK",c1b:"LP",c2t:"MK",c2b:"MP",c3t:"HK",c3b:"HP",c4t:"KK",c4b:"PP",thumb:"THU",palm:"PALM"};
const STD={L:[28,101],D:[58,101],R:[84,87],Up:[91,43],c1t:[110,70],c1b:[111,100],c2t:[137,82],c2b:[137,113],c3t:[165,81],c3b:[167,112],c4t:[194,76],c4b:[196,107]};
const CTRL_DEF=[["u1",21,"A2"],["u2",20,"A1"],["u3",19,"ST"],["u4",18,"SEL"]];
function standard(){const b={};for(const n in STD)b[n]={x:STD[n][0],y:STD[n][1],size:n==="Up"?30:24,type:"round"};
  const pico=121; // 生の座標（標準では DX=−1 なので板の座標 120 に当たる）
  const cx0=Math.round((pico+19*2.54/2+0.9+5+4)*10)/10;  // Pico の右端のピンから 4mm 外に 1 個目、以後 13mm 間隔（v3.1.2 と同じ）
  const ctrl=CTRL_DEF.map(([n,gp,lab],i)=>({name:n,gp,label:lab,x_raw:Math.round((cx0+13*i)*10)/10,size:10}));
  return {version:"slate_layout_gui "+VERSION,base:"v3.1.2",buttons:b,ctrl,pico_cx_raw:pico,pico_gap:0,slit:"lower_arcs",slit_arc:240,slit_pitch:5,l3:5.0,skin:0.36,margin:7};}
const FUNCS=["L3","R3","S1","S2","A1","A2","B1","B2","B3","B4","L1","L2","R1","R2","UP","DOWN","LEFT","RIGHT"];
const FUNC_JA={L3:"L3（左スティック押し込み）",R3:"R3（右スティック押し込み）",S1:"Select",S2:"Start",A1:"A1（Home）",A2:"A2（Capture）",B1:"B1（LK）",B2:"B2（MK）",B3:"B3（LP）",B4:"B4（MP）",L1:"L1（PP）",L2:"L2（KK）",R1:"R1（HP）",R2:"R2（HK）",UP:"上",DOWN:"下",LEFT:"左",RIGHT:"右"};
const CTRL_FUNC={A2:"A2",A1:"A1",ST:"S2",SEL:"S1"};
let lastFitKey=""; let layout=standard(), result=null, lastGood=null, selected=null, history=[], future=[], log=[]; const t0=Date.now();
function now(){return Math.round((Date.now()-t0)/100)/10;}
function logEv(kind,detail){log.push({t:now(),kind,...detail});}
function stateJSON(){return JSON.stringify({buttons:layout.buttons,ctrl:layout.ctrl,pico_cx_raw:layout.pico_cx_raw,pico_gap:layout.pico_gap,slit_arc:layout.slit_arc});}
function applyState(o){layout.buttons=o.buttons;layout.ctrl=o.ctrl;layout.pico_cx_raw=o.pico_cx_raw;layout.pico_gap=o.pico_gap;if(o.slit_arc!==undefined){layout.slit_arc=o.slit_arc;document.getElementById("arcAll").value=o.slit_arc;}}
function snapshot(){history.push(stateJSON());if(history.length>300)history.shift();future.length=0;cancelScan();if(!resolving)resolveMoves=[];updateUndoButtons();}
function updateUndoButtons(){const u=document.getElementById("undo"),r=document.getElementById("redo");if(u)u.disabled=!history.length;if(r)r.disabled=!future.length;}
function doUndo(){if(!history.length)return;future.push(stateJSON());applyState(JSON.parse(history.pop()));cancelScan();logEv("undo",{});selected=null;renderProps();updateUndoButtons();scheduleEval();}
function doRedo(){if(!future.length)return;history.push(stateJSON());applyState(JSON.parse(future.pop()));cancelScan();logEv("redo",{});selected=null;renderProps();updateUndoButtons();scheduleEval();}
function labelOf(n){return (layout.buttons[n]&&layout.buttons[n].label)||LABEL[n]||n;}
// ===================== Python（Pyodide） =====================
let py=null, pyReady=false, evalQueued=false, evaluating=false;
async function initPy(){
  try{
    py=await loadPyodide();
    document.getElementById("pystatus").textContent="numpy と shapely を読み込んでいます…";
    await py.loadPackage(["numpy","shapely"]);
    const [core,slit]=await Promise.all([fetch("slate_core.py?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()),fetch("slit_patterns.py?t="+Date.now(),{cache:"no-store"}).then(r=>r.text())]);
    py.FS.writeFile("slit_patterns.py",slit);py.FS.writeFile("slate_core.py",core);
    await py.runPythonAsync("import sys; sys.path.insert(0,'.'); import slate_core");
    pyReady=true;document.getElementById("pystatus").textContent="計算機の準備ができました";
    scheduleEval();
  }catch(e){document.getElementById("pystatus").textContent="計算機の読み込みに失敗しました："+e;console.error(e);}
}
function scheduleEval(){evalQueued=true;if(!evaluating)runEval();}
async function runEval(){
  if(!pyReady){draw();return;}
  evaluating=true;
  while(evalQueued){evalQueued=false;
    const s=JSON.stringify({buttons:layout.buttons,ctrl:layout.ctrl,pico_cx_raw:layout.pico_cx_raw,pico_gap:layout.pico_gap,slit:layout.slit,slit_arc:layout.slit_arc,slit_pitch:layout.slit_pitch,l3:layout.l3,skin:layout.skin,margin:layout.margin});
    const t=performance.now();
    try{const out=py.runPython("import slate_core; slate_core.evaluate_json("+JSON.stringify(s)+")");result=JSON.parse(out);result._ms=Math.round(performance.now()-t);if(result.board)lastGood=result;logEv("check",{ok:result.ok,errors:(result.errors||[]).length,warnings:(result.warnings||[]).length,worst:result.worst?result.worst.label+" "+result.worst.SF.toFixed(2):null,first_error:(result.errors||[])[0]||null});}
    catch(e){result={ok:false,errors:["計算に失敗："+e+"。ページを読み込み直してください"],warnings:[]};pyReady=false;document.getElementById("pystatus").textContent="計算機が止まりました。ページを読み込み直してください";}
    await new Promise(r=>setTimeout(r,0));
  }
  evaluating=false;renderStatus();
  if(result&&result.board){const k=result.board.W+"x"+result.board.H;if(k!==lastFitKey){lastFitKey=k;fit();}}
  draw();
  if(selected&&result&&!drag)startScan(selected);   // 待機中に、選んでいるものの動かせる範囲を計算しておく
}
// ===================== 幾何だけの即時検査（動かしている最中） =====================
function quickOverlaps(){const names=Object.keys(layout.buttons),bad=new Set();
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const a=layout.buttons[names[i]],b=layout.buttons[names[j]];
    const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<a.size/2+b.size/2+2){bad.add(names[i]);bad.add(names[j]);}}
  return bad;}
// ===================== 描画 =====================
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");let view={s:3,ox:0,oy:0};
function fit(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;
  const bb=boardRaw();const W=bb.x1-bb.x0+20,H=bb.y1-bb.y0+20;view.s=Math.min(r.width/W,r.height/H);view.ox=(r.width-W*view.s)/2-(bb.x0-10)*view.s;view.oy=(r.height+H*view.s)/2+(bb.y0-10)*view.s;draw();}
function boardRaw(){ // 板の外形（生の座標）。計算結果があればそれを使い、無ければ直前の正常な結果、それも無ければボタンの外接から概算
  const R=(result&&result.board)?result:lastGood;if(R){const b=R.board;return {x0:b.X0-b.DX,x1:b.X1-b.DX,y0:b.Y0-b.DY,y1:b.Y1-b.DY};}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const n in layout.buttons){const b=layout.buttons[n];x0=Math.min(x0,b.x-b.size/2);x1=Math.max(x1,b.x+b.size/2);y0=Math.min(y0,b.y-b.size/2);y1=Math.max(y1,b.y+b.size/2);}
  return {x0:x0-15,x1:Math.max(x1,layout.pico_cx+30)+15,y0:y0-14,y1:y1+70};}
function X(x){return (view.ox+x*view.s)*devicePixelRatio;}function Y(y){return (view.oy-y*view.s)*devicePixelRatio;}function S(l){return l*view.s*devicePixelRatio;}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);const R=(result&&result.board)?result:lastGood;const stale=!(result&&result.board);const DX=R?R.board.DX:0,DY=R?R.board.DY:0;const toRaw=(p)=>[p[0]-DX,p[1]-DY];
  const bb=boardRaw();ctx.fillStyle="#efece2";ctx.strokeStyle="#b4b2a9";ctx.lineWidth=S(0.5);roundRect(X(bb.x0),Y(bb.y1),S(bb.x1-bb.x0),S(bb.y1-bb.y0),S(8));ctx.fill();ctx.stroke();
  ctx.fillStyle="#777";ctx.font=`${S(3.2)}px sans-serif`;ctx.textAlign="left";ctx.fillText(`板 ${(bb.x1-bb.x0).toFixed(0)} × ${(bb.y1-bb.y0).toFixed(0)} mm（手前が下・Pico は奥）`,X(bb.x0)+S(3),Y(bb.y0)-S(3));
  if(scanState){const st=scanState;if(st.kind==="xy"){for(const [k,code] of st.cells){const [x,y]=k.split(",").map(Number);ctx.fillStyle=SCAN_COLOR[code]||SCAN_COLOR.E;ctx.fillRect(X(x-CELL/2),Y(y+CELL/2),S(CELL),S(CELL));}}
    else{const rowY=st.rowY;const w=(st.target==="pico")?51:((layout.ctrl||[]).find(c=>"ctrl:"+c.name===st.target)||{size:10}).size;for(const [k,code] of st.cells){const x=Number(k.split(",")[0]);ctx.fillStyle=SCAN_COLOR[code]||SCAN_COLOR.E;ctx.fillRect(X(x-CELL/2),Y(rowY+w/2+1),S(CELL),S(w+2));}}
    ctx.fillStyle="#555";ctx.font=`${S(3)}px sans-serif`;ctx.textAlign="right";const left=st.queue.length;ctx.fillText(`動かせる範囲：緑＝設計できる・赤＝配線が交差・橙＝安全率の不足・灰＝重なる${left?`（計算中 残り ${left} 点）`:`（${(st.done/1000).toFixed(1)} 秒で ${st.n} 点）`}`,X(bb.x1)-S(2),Y(bb.y1)+S(4.5));}
  if(R&&R.pico){const p=R.pico;const cx=p.cx-DX;ctx.globalAlpha=(stale?0.35:1)*((drag&&drag.moved&&drag.n==="pico")?0.35:1);ctx.fillStyle="#e3e0d6";ctx.strokeStyle="#9a988f";ctx.lineWidth=S(0.3);ctx.fillRect(X(cx-25.5),Y(p.far_y-DY),S(51),S(p.far_y-p.sig_y));ctx.strokeRect(X(cx-25.5),Y(p.far_y-DY),S(51),S(p.far_y-p.sig_y));
    ctx.fillStyle="#888";ctx.textAlign="center";ctx.fillText("Raspberry Pi Pico",X(cx),Y((p.sig_y+p.far_y)/2-DY)+S(1.2));
    for(const q of p.top.concat(p.bot)){ctx.fillStyle="#aaa";ctx.beginPath();ctx.arc(X(q[0]-DX),Y(q[1]-DY),S(0.9),0,7);ctx.fill();}
    if(selected==="pico"){ctx.strokeStyle="#e04a00";ctx.lineWidth=S(0.8);ctx.strokeRect(X(cx-25.5),Y(p.far_y-DY),S(51),S(p.far_y-p.sig_y));}
    for(const c of R.ctrl){const sel=selected==="ctrl:"+c.n;const r=(c.size||10)/2;ctx.globalAlpha=(stale?0.35:1)*((drag&&drag.moved&&drag.c&&drag.c.name===c.n)?0.35:1);ctx.fillStyle="rgba(138,136,127,.35)";ctx.strokeStyle=sel?"#e04a00":"#5f5e5a";ctx.lineWidth=S(sel?0.8:0.3);ctx.beginPath();ctx.arc(X(c.x-DX),Y(c.y-DY),S(r),0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#333";ctx.font=`${S(Math.min(3.2,r*0.6))}px sans-serif`;ctx.textAlign="center";ctx.fillText(c.label,X(c.x-DX),Y(c.y-DY)+S(1.1));}
    ctx.strokeStyle="rgba(24,95,165,.8)";ctx.lineWidth=S(1.2);ctx.lineCap="round";ctx.lineJoin="round";
    for(const n in R.routes){const r=R.routes[n];ctx.beginPath();r.forEach((q,i)=>{const [x,y]=toRaw(q);i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y));});ctx.stroke();}
    for(const n in (R.buttons||{})){if(!layout.buttons[n])continue;const b=R.buttons[n];const sv=toRaw(b.sig_via),gv=toRaw(b.gnd_via);ctx.fillStyle="#185FA5";ctx.beginPath();ctx.arc(X(sv[0]),Y(sv[1]),S(1.1),0,7);ctx.fill();ctx.fillStyle="#3b6d11";ctx.beginPath();ctx.arc(X(gv[0]),Y(gv[1]),S(1.1),0,7);ctx.fill();}
    ctx.globalAlpha=1;
  }
  const bad=quickOverlaps();const crossSet=new Set();if(result&&result.crossings)for(const c of result.crossings){crossSet.add(c[0]);crossSet.add(c[1]);}
  for(const n in layout.buttons){const b=layout.buttons[n];const r=b.size/2;const isSel=n===selected;const isBad=bad.has(n)||crossSet.has(n);ctx.globalAlpha=(drag&&drag.moved&&drag.n===n)?0.35:1;
    ctx.lineWidth=S(isSel?1.0:0.5);ctx.strokeStyle=isBad?"#b42318":(isSel?"#e04a00":"#7a4a12");
    if(b.type==="qwall"){const rects=result&&result.buttons&&result.buttons[n]&&result.buttons[n].qwall;if(rects){for(const [k,rc] of rects.entries()){ctx.fillStyle=k?"rgba(200,115,26,.9)":"rgba(200,115,26,.35)";ctx.beginPath();rc.forEach((q,i)=>{const [x,y]=toRaw(q);i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y));});ctx.closePath();ctx.fill();ctx.stroke();}}}

function hit(px,py){let best=null,bd=1e9;for(const n in layout.buttons){const b=layout.buttons[n];const d=Math.hypot(px-b.x,py-b.y);if(d<b.size/2+1&&d<bd){bd=d;best=n;}}

  for(const c of layout.ctrl||[]){if(Math.hypot(px-c.x_raw,py-rowY)<c.size/2+1)return "ctrl:"+c.name;}
  if(Math.abs(px-layout.pico_cx_raw)<25.5&&py>rowY-2&&py<R.pico.far_y-DY+2)return "pico";return null;}

const SNAP_MM=3;
function snapTo(d,gx,gy){const R=lastGood;const lines=[];let bx=gx,by=gy;
  const r=d.c?d.c.size/2:(d.n==="pico"?25.5:layout.buttons[d.n].size/2);
  const others=[];for(const [m,o] of Object.entries(layout.buttons)){if(d.n===m)continue;others.push({x:o.x,y:o.y,r:o.size/2,lab:labelOf(m)});}
  if(R){const rowY=R.pico.sig_y-R.board.DY;for(const c of layout.ctrl||[]){if(d.c===c)continue;others.push({x:c.x_raw,y:rowY,r:c.size/2,lab:c.label});}}
  // x：中心どうし・左端どうし・右端どうし
  let best=null;for(const o of others){for(const [off,kind] of [[0,"中心"],[o.r-r,"左端"],[-(o.r-r),"右端"]]){const tx=o.x+off;const dd=Math.abs(gx-tx);if(dd<=SNAP_MM&&(!best||dd<best.d))best={d:dd,x:tx,o,kind,off};}}
  if(best){bx=best.x;const lx=best.kind==="中心"?best.o.x:(best.kind==="左端"?best.o.x-best.o.r:best.o.x+best.o.r);lines.push({axis:"x",at:lx,lab:`${best.o.lab} の${best.kind}`});}
  if(!d.c&&d.n!=="pico"){best=null;for(const o of others){for(const [off,kind] of [[0,"中心"],[o.r-r,"上端"],[-(o.r-r),"下端"]]){const ty=o.y+off;const dd=Math.abs(gy-ty);if(dd<=SNAP_MM&&(!best||dd<best.d))best={d:dd,y:ty,o,kind,off};}}
    if(best){by=best.y;const ly=best.kind==="中心"?best.o.y:(best.kind==="上端"?best.o.y+best.o.r:best.o.y-best.o.r);lines.push({axis:"y",at:ly,lab:`${best.o.lab} の${best.kind}`});}}
  return {x:bx,y:by,lines};}

  layout.buttons["x"+k]={x:Math.round(mx+6+12),y:Math.round(my),size:24,type:"round",func:f,label:f};logEv("add",{btn:"x"+k,func:f});selected="x"+k;renderProps();scheduleEval();});
document.getElementById("addCtrl").addEventListener("click",()=>{layout.ctrl=layout.ctrl||[];if(layout.ctrl.length>=4){document.getElementById("pystatus").textContent="制御ボタンは 4 個までです（GP18〜GP21）";return;}snapshot();
  const usedGp=new Set(layout.ctrl.map(c=>c.gp));const def=CTRL_DEF.find(([n,gp])=>!usedGp.has(gp));const maxx=Math.max(layout.pico_cx_raw+19*2.54/2+0.9+5+4,...layout.ctrl.map(c=>c.x_raw+c.size/2+5+2));
  layout.ctrl.push({name:def[0],gp:def[1],label:def[2],x_raw:Math.round(maxx*10)/10,size:10});logEv("add_ctrl",{btn:def[2]});selected="ctrl:"+def[0];renderProps();scheduleEval();});
document.getElementById("arcAll").addEventListener("change",e=>{snapshot();layout.slit_arc=+e.target.value;for(const n in layout.buttons)delete layout.buttons[n].arc;logEv("arc_all",{to:layout.slit_arc});renderProps();scheduleEval();});
document.getElementById("undo").addEventListener("click",doUndo);document.getElementById("redo").addEventListener("click",doRedo);
window.addEventListener("keydown",e=>{const mod=e.metaKey||e.ctrlKey;if(!mod)return;if(e.key==="z"||e.key==="Z"){e.preventDefault();if(e.shiftKey)doRedo();else doUndo();}else if(e.key==="y"||e.key==="Y"){e.preventDefault();doRedo();}});
document.getElementById("reset").addEventListener("click",()=>{snapshot();layout=standard();selected=null;logEv("reset",{});document.getElementById("arcAll").value=240;renderProps();fit();scheduleEval();});
// ===================== 自動制約解消（α版）：1 手ずつ Python に進めさせ、矢印を描きながら、上限で止める =====================
const RESOLVE_MAX_STEPS=30, RESOLVE_MAX_EVALS=900;   // 収束しないことがあるので、手数と評価回数の両方に上限を置く
let resolving=false, resolveMoves=[], resolveStopFlag=false;
async function runResolve(){if(resolving||!pyReady)return;const fixed=[];if(selected&&selected!=="pico")fixed.push(selected);if(selected==="pico")fixed.push("pico");
  snapshot();cancelScan();resolving=true;resolveStopFlag=false;resolveMoves=[];const L0=JSON.parse(stateJSON());let steps=0,evals=0;const info=document.getElementById("resolveInfo");
  document.getElementById("resolve").disabled=true;document.getElementById("resolveStop").hidden=false;logEv("resolve_start",{fixed});
  const t0=performance.now();let last=null;
  while(steps<RESOLVE_MAX_STEPS&&evals<RESOLVE_MAX_EVALS&&!resolveStopFlag){
    const L={buttons:layout.buttons,ctrl:layout.ctrl,pico_cx_raw:layout.pico_cx_raw,pico_gap:layout.pico_gap,slit:layout.slit,slit_arc:layout.slit_arc,slit_pitch:layout.slit_pitch,l3:layout.l3,skin:layout.skin,margin:layout.margin};
    const L0s={buttons:L0.buttons,ctrl:L0.ctrl,pico_cx_raw:L0.pico_cx_raw,pico_gap:L0.pico_gap};
    let o;try{o=JSON.parse(py.runPython("import slate_core; slate_core.resolve_step_json("+JSON.stringify(JSON.stringify({layout:L,fixed,layout0:L0s}))+")"));}catch(e){console.error(e);info.textContent="計算に失敗："+e;break;}
    evals+=o.evals||0;last=o;
    if(o.move){const [n,dx,dy]=o.move;steps++;if(n.startsWith("ctrl:")){const c=layout.ctrl.find(c=>"ctrl:"+c.name===n);if(c)c.x_raw+=dx;}else{layout.buttons[n].x+=dx;layout.buttons[n].y+=dy;}
      resolveMoves.push({n,dx,dy});info.textContent=`${steps} 手目：${n.startsWith("ctrl:")?(layout.ctrl.find(c=>"ctrl:"+c.name===n)||{label:n}).label:labelOf(n)} を ${dirName(dx,dy)} ${Math.hypot(dx,dy).toFixed(0)}mm（評価 ${evals} 回・罰則 ${(o.penalty||0).toFixed(1)}）`;draw();}
    if(o.done)break;
    await new Promise(r=>setTimeout(r,0));
  }
  const dt=((performance.now()-t0)/1000).toFixed(1);const ok=!!(last&&last.ok);
  const summary=resolveMoves.length?sumMoves():"動かしたボタンはありません";
  info.textContent=ok?`設計できる形になりました（${steps} 手・評価 ${evals} 回・${dt} 秒）。${summary}。気に入らなければ「元に戻す」で戻せます`:(resolveStopFlag?`止めました（${steps} 手）。${summary}`:(steps>=RESOLVE_MAX_STEPS||evals>=RESOLVE_MAX_EVALS?`上限（${RESOLVE_MAX_STEPS} 手または評価 ${RESOLVE_MAX_EVALS} 回）に達しました。${summary}。「元に戻す」で戻せます`:`これ以上は改善できませんでした（${steps} 手）。${summary}。置いたボタンを別の場所に動かしてください`));
  logEv("resolve_end",{ok,steps,evals,moves:resolveMoves});resolving=false;document.getElementById("resolve").disabled=false;document.getElementById("resolveStop").hidden=true;renderProps();scheduleEval();}
function dirName(dx,dy){const h=dx>0?"右":dx<0?"左":"",v=dy>0?"奥":dy<0?"手前":"";return (h+v)||"そのまま";}
function sumMoves(){const agg={};for(const m of resolveMoves){const a=agg[m.n]||(agg[m.n]={dx:0,dy:0});a.dx+=m.dx;a.dy+=m.dy;}
  return "動かしたもの："+Object.entries(agg).map(([n,a])=>`${n.startsWith("ctrl:")?((layout.ctrl||[]).find(c=>"ctrl:"+c.name===n)||{label:n}).label:labelOf(n)} を ${dirName(a.dx,a.dy)} ${Math.hypot(a.dx,a.dy).toFixed(0)}mm`).join("、");}
document.getElementById("resolve").addEventListener("click",runResolve);
document.getElementById("resolveStop").addEventListener("click",()=>{resolveStopFlag=true;});
// ===================== 動かせる範囲の走査（押した瞬間に始め、待機中にも選んだものについて計算しておく） =====================
//  5mm の格子の各点に対象を置いたときの判定を、中核の計算（本番と同じ検査）で求める。幾何の重なりは JavaScript で先に判定して除く。
//  近い点から順に計算し、12 点ごとに描き足す。レイアウトが変わると捨てる（配線は全ボタンの位置で決まるため）。
const CELL=5; let scanState=null;
const SCAN_COLOR={O:"rgba(42,125,58,.28)",X:"rgba(180,35,24,.30)",S:"rgba(183,121,31,.35)",G:"rgba(90,90,90,.14)",E:"rgba(120,60,160,.3)"};
function cancelScan(){scanState=null;}
function scanTargetPos(t){if(t==="pico")return [layout.pico_cx_raw,0];if(t&&t.startsWith("ctrl:")){const c=(layout.ctrl||[]).find(c=>"ctrl:"+c.name===t);return c?[c.x_raw,0]:null;}const b=layout.buttons[t];return b?[b.x,b.y]:null;}
function startScan(target){if(!target)return;if(scanState&&scanState.target===target)return;const pos=scanTargetPos(target);if(!pos)return;
  const bs=Object.values(layout.buttons);const x0=Math.floor((Math.min(...bs.map(b=>b.x))-30)/CELL)*CELL,x1=Math.ceil((Math.max(...bs.map(b=>b.x))+30)/CELL)*CELL,y0=Math.floor((Math.min(...bs.map(b=>b.y))-30)/CELL)*CELL,y1=Math.ceil((Math.max(...bs.map(b=>b.y))+30)/CELL)*CELL;
  const cells=new Map(),queue=[];
  if(target==="pico"||target.startsWith("ctrl:")){const R=lastGood;const rowY=R?R.pico.sig_y-R.board.DY:y1;const c=target.startsWith("ctrl:")?(layout.ctrl||[]).find(c=>"ctrl:"+c.name===target):null;
    for(let x=x0-40;x<=x1+40;x+=CELL){let g=false;if(c){const r=c.size/2;g=(layout.ctrl||[]).some(o=>o!==c&&Math.abs(o.x_raw-x)<o.size/2+r+2)||(R&&(x+r>R.pico.x_lo-R.board.DX&&x-r<R.pico.x_hi-R.board.DX));}
      if(g)cells.set(x+",0","G");else queue.push([x,0]);}
    queue.sort((a,b)=>Math.abs(a[0]-pos[0])-Math.abs(b[0]-pos[0]));scanState={target,cells,queue,rowY,kind:"x",t0:performance.now(),n:queue.length};}
  else{const b=layout.buttons[target];const r=b.size/2;
    for(let x=x0;x<=x1;x+=CELL)for(let y=y0;y<=y1;y+=CELL){const g=Object.entries(layout.buttons).some(([m,o])=>m!==target&&Math.hypot(o.x-x,o.y-y)<o.size/2+r+2);if(g)cells.set(x+","+y,"G");else queue.push([x,y]);}
    queue.sort((a,b)=>Math.hypot(a[0]-pos[0],a[1]-pos[1])-Math.hypot(b[0]-pos[0],b[1]-pos[1]));scanState={target,cells,queue,kind:"xy",t0:performance.now(),n:queue.length};}
  draw();runScanChunk();}
function runScanChunk(){const st=scanState;if(!st||!pyReady)return;if(evaluating||!st.queue.length){if(st.queue.length)setTimeout(runScanChunk,60);else{st.done=performance.now()-st.t0;draw();}return;}
  const pts=st.queue.splice(0,12);const L={buttons:layout.buttons,ctrl:layout.ctrl,pico_cx_raw:layout.pico_cx_raw,pico_gap:layout.pico_gap,slit:layout.slit,slit_arc:layout.slit_arc,slit_pitch:layout.slit_pitch,l3:layout.l3,skin:layout.skin,margin:layout.margin};
  try{const out=JSON.parse(py.runPython("import slate_core; slate_core.scan_json("+JSON.stringify(JSON.stringify({layout:L,target:st.target,points:pts}))+")"));
    if(scanState!==st)return;for(const [x,y,code] of out)st.cells.set(x+","+y,code);}
  catch(e){console.error(e);scanState=null;return;}
  draw();setTimeout(runScanChunk,0);}
document.getElementById("export").addEventListener("click",async()=>{logEv("export",{ok:result?result.ok:null});const out={...layout,result_summary:result?{ok:result.ok,errors:result.errors,warnings:result.warnings,board:result.board,worst:result.worst,gpio:Object.fromEntries(Object.entries(result.buttons||{}).map(([n,b])=>[labelOf(n),b.gp]))}:null,elapsed_s:now(),log};
  const s=JSON.stringify(out,null,1);document.getElementById("json").value=s;try{await navigator.clipboard.writeText(s);document.getElementById("pystatus").textContent="JSON をコピーしました。スレッドに貼ってください";}catch(e){document.getElementById("pystatus").textContent="下の欄の JSON を選んでコピーしてください";}});
document.getElementById("import").addEventListener("click",()=>{try{const o=JSON.parse(document.getElementById("json").value);if(!o.buttons)throw new Error("buttons が無い");snapshot();for(const k of ["buttons","ctrl","pico_cx_raw","pico_gap","slit","slit_arc","slit_pitch","l3","skin","margin"])if(o[k]!==undefined)layout[k]=o[k];if(o.pico_cx!==undefined&&o.pico_cx_raw===undefined)layout.pico_cx_raw=o.pico_cx+1;logEv("import",{});selected=null;renderProps();fit();scheduleEval();}catch(e){document.getElementById("pystatus").textContent="JSON を読み込めません："+e.message;}});
function renderStatus(){const v=document.getElementById("verdict"),m=document.getElementById("msgs"),bi=document.getElementById("boardinfo");m.innerHTML="";
  if(!result){v.className="verdict wait";v.textContent="計算を待っています";return;}
  v.className="verdict "+(result.ok?"ok":"err");v.textContent=result.ok?"設計できます（交差 0・安全率 1.5 以上）":"このままでは設計できません";
  document.getElementById("resolveRow").hidden=!!result.ok||resolving;
  for(const e of result.errors||[]){const li=document.createElement("li");li.className="err";li.textContent=e;m.appendChild(li);}
  for(const w of result.warnings||[]){const li=document.createElement("li");li.className="warn";li.textContent=w;m.appendChild(li);}
  bi.textContent=result.board?`板 ${result.board.W} × ${result.board.H} mm・最悪の安全率 ${result.worst?result.worst.label+" "+result.worst.SF.toFixed(2):"—"}・計算 ${result._ms} ms`:"";
  const tb=document.querySelector("#sftable tbody");tb.innerHTML="";for(const r of result.sf||[]){const tr=document.createElement("tr");if(result.worst&&r.n===result.worst.n)tr.className="worst";tr.innerHTML=`<td>${r.label}</td><td>${r.gp}</td><td>${r.Ls.toFixed(0)}</td><td>${r.Lg.toFixed(0)}</td><td>${r.Rlow_k.toFixed(1)}</td><td>${r.SF.toFixed(2)}</td>`;tb.appendChild(tr);}
  if(pyReady)document.getElementById("pystatus").textContent="計算機の準備ができました";}
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
document.getElementById("ver").textContent=VERSION;updateUndoButtons();window.addEventListener("resize",fit);fit();renderProps();initPy();
</script>
