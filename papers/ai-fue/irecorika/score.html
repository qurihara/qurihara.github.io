<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記録帳 — iRecorika</title>
<link rel="stylesheet" href="lib/irk.css?v=2">
</head>
<body>
<script src="lib/fft_peak.js?v=2"></script>
<script src="lib/irk-common.js?v=2"></script>
<script src="lib/irk-audio.js?v=2"></script>
<script src="lib/irk-stage.js?v=2"></script>
<script>
/* 記録帳：吹いた音の高さと長さを記録する。思いついた旋律を書き留め、再生し、文字列として持ち出せる。
 * 記録は音そのものではなく、どの笛をいつからいつまで吹いたかの列なので、軽くて編集しやすい。
 * 再生は笛と同じ高さ（または1オクターブ下）で鳴らし、その笛の帯を光らせる。 */
(function () {
  "use strict";
  const KEY = "irecorika.score.v1";
  const st = { rec: false, t0: 0, notes: [], open: null, playing: false, timers: [], saved: [], octDown: false };
  try { st.saved = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (_) {}

  const panel = "<fieldset><legend>記録</legend>"
    + "<div class='row'><button class='btn small' id='copy'>文字列を写す</button><button class='btn small' id='share'>共有用のURLを写す</button>"
    + "<label><input type='checkbox' id='oct'> 1オクターブ下で再生（保護を通すので、再生中も吹ける）</label></div>"
    + "<textarea id='text' rows='3' style='width:100%;background:#141824;color:#eef0f6;border:1px solid #2a2f3d;border-radius:8px' placeholder='G#6:0.40 A6:0.30 … の形。貼り付けて「読み込む」も可'></textarea>"
    + "<div class='row'><button class='btn small' id='import'>文字列を読み込む</button></div>"
    + "<h3 style='font-size:15px'>保存した記録</h3><div id='list'></div></fieldset>";

  const stage = IRKStage.create({
    title: "記録帳",
    desc: "吹いた音の高さと長さを記録します。思いついた旋律を書き留めて、再生したり、文字列やURLにして持ち出したりできます。",
    panel,
    pads: {
      left: [{ id: "rec", label: "● 記録" }, { id: "play", label: "▶ 再生" }, { id: "undo", label: "1音消す" }, { id: "rest", label: "休みを入れる" }],
      right: [{ id: "save", label: "保存" }, { id: "clear", label: "全部消す" }, { id: "oct", label: "1オクターブ下で再生", toggle: true }, { id: "loop", label: "繰り返し再生", toggle: true }],
    },
    onStart: async () => { await det.start(); },
    onPad(id, down) {
      if (id === "oct") { st.octDown = down; $("oct").checked = down; return; }
      if (id === "loop") { st.loop = down; return; }
      if (!down) return;
      if (id === "rec") st.rec ? stopRec() : startRec();
      if (id === "play") st.playing ? stopPlay() : play();
      if (id === "undo") { st.notes.pop(); render(); }
      if (id === "rest") { const last = st.notes[st.notes.length - 1]; if (last) last.rest = (last.rest || 0) + 0.5; render(); }
      if (id === "save") save();
      if (id === "clear") { st.notes = []; render(); }
    },
    draw(g, geo, now) {
      // 右から左へ流れるピアノロール（直近8秒）
      if (!st.notes.length && !st.open) return;
      const t = st.rec ? (performance.now() - st.t0) / 1000 : (st.notes.length ? st.notes[st.notes.length - 1].t + st.notes[st.notes.length - 1].d : 0);
      const H = geo.height, pxs = H / 8;
      const all = st.open ? st.notes.concat([{ slot: st.open.slot, t: st.open.t, d: t - st.open.t }]) : st.notes;
      for (const n of all) {
        const l = geo.lanes[n.slot];
        const y1 = H - (t - (n.t + n.d)) * pxs, y0 = H - (t - n.t) * pxs;
        if (y1 < 0) continue;
        g.fillStyle = IRK.slotColor(n.slot, 0.55);
        g.fillRect(l.x0 + 4, Math.max(0, y0), l.x1 - l.x0 - 8, Math.max(2, y1 - Math.max(0, y0)));
      }
    },
  });
  const $ = id => document.getElementById(id);

  function startRec() { stopPlay(); st.rec = true; st.t0 = performance.now(); st.notes = []; st.open = null; stage.setPad("rec", "■ 止める"); stage.setPadOn("rec", true); render(); }
  function stopRec() { st.rec = false; st.open = null; stage.setPad("rec", "● 記録"); stage.setPadOn("rec", false); render(); }

  // 休みは記録の上では「次の音までの隙間」で表す。0.25秒未満の隙間は息継ぎとみなして休みにしない
  function toText(notes) {
    return notes.map((n, i) => {
      const nx = notes[i + 1];
      const gap = nx ? nx.t - (n.t + n.d) : 0;
      let s = IRK.noteName(IRK.slotToMidi(n.slot), "sharp") + ":" + n.d.toFixed(2);
      const rest = (n.rest || 0) + (gap >= 0.25 ? gap : 0);
      if (rest > 0) s += " R:" + rest.toFixed(2);
      return s;
    }).join(" ");
  }
  function fromText(text) {
    const out = []; let t = 0;
    for (const tok of text.trim().split(/\s+/)) {
      const m = tok.match(/^([A-G]#?)(\d):([\d.]+)$/), r = tok.match(/^R:([\d.]+)$/);
      if (r) { t += parseFloat(r[1]); continue; }
      if (!m) continue;
      const midi = IRK.NOTE_SHARP.indexOf(m[1]) + (parseInt(m[2], 10) + 1) * 12;
      const slot = IRK.midiToSlot(midi);
      if (slot < 0) continue;
      const d = parseFloat(m[3]);
      out.push({ slot, t, d });
      t += d + 0.05;
    }
    return out;
  }
  function render() {
    const txt = toText(st.notes);
    $("text").value = txt;
    const names = st.notes.slice(-10).map(n => "<span style='color:" + IRK.slotColor(n.slot, 1) + "'>" + IRK.noteName(IRK.slotToMidi(n.slot), "flat") + "</span>").join(" ");
    stage.setCenter("<div class='mid'>" + (st.rec ? "<span style='color:#ff6b6b'>● 記録中</span>" : st.playing ? "▶ 再生中" : "記録帳") + "</div>"
      + "<div class='mid'>" + names + "</div><div class='small'>" + st.notes.length + " 音</div>");
  }

  function play() {
    if (!st.notes.length) return;
    st.playing = true; stage.setPad("play", "■ 止める");
    const ac = IRKAudio.ctx();
    const t0 = ac.currentTime + 0.15;
    const first = st.notes[0].t;
    let end = 0;
    let shift = 0;
    for (const n of st.notes) {
      const at = n.t - first + shift;
      end = at + n.d;
      shift += n.rest || 0;
      const midi = IRK.slotToMidi(n.slot) - (st.octDown ? 12 : 0);
      IRKAudio.note(midi, { type: "triangle", vel: 0.35, when: t0 + at, dur: n.d, dest: st.octDown ? undefined : IRKAudio.bus().rawOut });
      st.timers.push(setTimeout(() => stage.hold(n.slot, 1), (0.15 + at) * 1000));
      st.timers.push(setTimeout(() => stage.hold(n.slot, 0), (0.15 + at + n.d) * 1000));
    }
    if (!st.octDown) det.mute((end + 0.5) * 1000);
    st.timers.push(setTimeout(() => { stopPlay(); if (st.loop) play(); }, (end + 0.4) * 1000));
    render();
  }
  function stopPlay() { st.timers.forEach(clearTimeout); st.timers = []; st.playing = false; stage.setPad("play", "▶ 再生"); stage.clearHold(); render(); }

  function save() {
    if (!st.notes.length) return;
    st.saved.unshift({ at: Date.now(), text: toText(st.notes) });
    st.saved = st.saved.slice(0, 30);
    try { localStorage.setItem(KEY, JSON.stringify(st.saved)); } catch (_) {}
    list();
    stage.setCenter("<div class='mid'>保存しました</div>");
  }
  function list() {
    $("list").innerHTML = st.saved.length ? "" : "<div class='note'>まだありません。</div>";
    st.saved.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = "<button class='btn small'>読み込む</button><button class='btn small'>削除</button><span class='note'>" + new Date(s.at).toLocaleString() + "　" + s.text.slice(0, 60) + (s.text.length > 60 ? "…" : "") + "</span>";
      row.children[0].onclick = () => { st.notes = fromText(s.text); render(); };
      row.children[1].onclick = () => { st.saved.splice(i, 1); try { localStorage.setItem(KEY, JSON.stringify(st.saved)); } catch (_) {} list(); };
      $("list").appendChild(row);
    });
  }
  list();
  $("copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText($("text").value);
  $("share").onclick = () => navigator.clipboard && navigator.clipboard.writeText(location.origin + location.pathname + "#rec=" + encodeURIComponent($("text").value));
  $("import").onclick = () => { st.notes = fromText($("text").value); render(); };
  $("oct").onchange = () => { st.octDown = $("oct").checked; stage.setPadOn("oct", st.octDown); };
  const shared = IRK.param("rec");
  if (shared) { st.notes = fromText(shared); }

  const det = IRKAudio.Detector({
    onNote(ev) {
      if (!st.playing) { stage.clearHold(); stage.hold(ev.slot, 1); }
      if (st.rec) {
        const t = (performance.now() - st.t0) / 1000;
        if (st.open) st.notes.push({ slot: st.open.slot, t: st.open.t, d: t - st.open.t });
        st.open = { slot: ev.slot, t };
        render();
      }
    },
    onOff(ev) {
      if (!st.playing && !ev.changed) { stage.hold(ev.slot, 0); stage.flash(ev.slot, 0.6); }
      if (st.rec && st.open && !ev.changed) {
        // 止んだと判定するまでに3フレーム（約36ms）かかるので、その分を差し引く
        const t = (performance.now() - st.t0) / 1000 - 0.036;
        st.notes.push({ slot: st.open.slot, t: st.open.t, d: Math.max(0.05, t - st.open.t) });
        st.open = null;
        render();
      }
    },
  });
  stage.attachDetector(det);
  render();
})();
</script>
</body>
</html>
